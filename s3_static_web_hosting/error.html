<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Rohit Cloud</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            color: #60a5fa;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #60a5fa;
        }

        .error-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .error-section h1 {
            font-size: 100px;
            color: #2563eb;
            margin-bottom: 10px;
        }

        .error-section h2 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .error-section p {
            font-size: 18px;
            color: #6b7280;
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 13px 25px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .button:hover {
            background: #1d4ed8;
        }

        footer {
            background: #111827;
            color: #d1d5db;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h2>Rohit Cloud</h2>

        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <section class="error-section">

        <h1>404</h1>

        <h2>Page Not Found</h2>

        <p>
            Sorry, the page you are looking for does not exist.
            It may have been removed, renamed, or the URL may be incorrect.
        </p>

        <a href="index.html" class="button">Go Back Home</a>

    </section>

    <footer>
        <p>© 2026 Rohit Cloud | AWS Static Website</p>
    </footer>

</body>
</html>
